<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin — Encanto Miranda</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="../assets/css/style.css?v=5">
<style>
:root{--adm:#78583E;--adm-dark:#38271D;--adm-bg:#F8F5F0;--adm-card:#fffdfa;--adm-line:#E6DCCF;--adm-mut:#857568}
body{background:var(--adm-bg)}
.login-card{max-width:400px;margin:8vh auto;background:var(--adm-card);border:1px solid var(--adm-line);border-radius:10px;padding:36px 32px;box-shadow:0 24px 60px -24px rgba(56,39,29,.28);text-align:center}
.login-card img{height:56px;margin:0 auto 16px}
.login-card h1{font-family:Georgia,serif;font-weight:400;font-size:26px;color:var(--adm-dark);margin-bottom:6px}
.login-card p{font-size:13px;color:var(--adm-mut);margin-bottom:20px}
.login-card .campo{text-align:left;margin-bottom:12px}
.login-card .campo input{width:100%}
.login-erro{display:none;background:#FDECEC;border:1px solid #F3B8B8;color:#8F2B2B;font-size:13px;border-radius:6px;padding:10px;margin-bottom:12px}
.login-dica{margin-top:14px;font-size:11px;color:#9A8978}
#app{display:none;min-height:100vh}
.adm-shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
.adm-side{background:var(--adm-dark);color:#D7C8B7;padding:20px 12px;position:sticky;top:0;height:100vh;overflow-y:auto}
.adm-side .logo img{height:38px;filter:brightness(0) invert(1);margin:0 0 4px 8px}
.adm-side small{display:block;font-size:10px;letter-spacing:.14em;color:#B8A592;margin:0 0 16px 8px}
.adm-nav button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;color:#D7C8B7;font-size:13.5px;font-weight:600;padding:12px 12px;border-radius:8px;cursor:pointer;margin-bottom:2px;text-align:left}
.adm-nav button i{font-style:normal;width:22px;text-align:center;font-size:16px}
.adm-nav button:hover{background:color-mix(in srgb,var(--adm) 55%,white);color:#fff}
.adm-nav button.ativo{background:var(--adm);color:#fff}
.adm-main{padding:28px clamp(16px,3vw,36px) 70px;max-width:1050px}
.adm-main h2{font-family:Georgia,serif;font-weight:400;font-size:30px;color:var(--adm-dark);margin-bottom:4px}
.adm-sub{font-size:13.5px;color:var(--adm-mut);margin-bottom:20px}
.card{background:var(--adm-card);border:1px solid var(--adm-line);border-radius:10px;padding:20px;box-shadow:0 8px 22px -12px rgba(56,39,29,.18);margin-bottom:14px}
.btn-grande{font-size:14px!important;padding:16px 26px!important}
.frase{font-size:15px;color:#463426;padding:12px 0;border-bottom:1px dashed var(--adm-line)}
.frase:last-child{border-bottom:0}
.frase b{color:var(--adm-dark)}
.atalhos{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--adm-mut);padding:10px;border-bottom:1px solid var(--adm-line)}
.tbl td{padding:10px;border-bottom:1px solid #EFE7DB;vertical-align:middle}
.tbl tr:hover td{background:#FBF7F1}
.pfoto{width:46px;height:58px;object-fit:cover;border-radius:6px;border:1px solid var(--adm-line)}
.badge{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:#F1E7DA;color:#5A422F;white-space:nowrap}
.badge.promo{background:var(--adm);color:#fff}
.badge.lanc{background:#E4EFE4;color:#397a49}
.badge.baixo{background:#FBEEDF;color:#9A5B1E}
.badge.zero{background:#FDECEC;color:#8F2B2B}
.badge.ok{background:#E4EFE4;color:#397a49}
.btn-mini{border:1px solid #DCCDBB;background:#fff;border-radius:6px;padding:7px 12px;font-size:12px;font-weight:700;cursor:pointer;color:#5A422F;margin:2px}
.btn-mini:hover{background:#F2E8DC}
.btn-mini.perigo{color:#8F2B2B;border-color:#E5AAAA}
.toolbar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.toolbar input,.toolbar select{padding:12px 14px;border:1px solid #DCCDBB;border-radius:8px;font-size:13px;background:#fff;flex:1;min-width:180px}
.form label{display:block;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--adm-mut);margin:14px 0 6px}
.form input[type=text],.form input[type=number],.form input[type=date],.form select,.form textarea{width:100%;padding:12px 14px;border:1px solid #DCCDBB;border-radius:8px;font-size:14px;background:#fff;font-family:inherit}
.form textarea{min-height:80px;resize:vertical}
.form input:focus,.form select:focus,.form textarea:focus{border-color:var(--adm);outline:none;box-shadow:0 0 0 3px rgba(120,88,62,.12)}
.passos{display:flex;gap:6px;margin-bottom:18px}
.passos span{flex:1;text-align:center;font-size:11px;font-weight:700;color:var(--adm-mut);padding:8px 4px;border-radius:6px;background:#F1E7DA}
.passos span.on{background:var(--adm);color:#fff}
.modal-fundo{position:fixed;inset:0;background:rgba(36,26,20,.5);z-index:200;display:none;align-items:flex-start;justify-content:center;padding:24px 12px;overflow-y:auto}
.modal-fundo.aberto{display:flex}
.modal{background:var(--adm-card);border-radius:12px;max-width:640px;width:100%;padding:26px;box-shadow:0 30px 80px -20px rgba(0,0,0,.4)}
.galeria{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:8px}
.galeria img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:6px;border:2px solid transparent;cursor:pointer}
.galeria img.sel{border-color:var(--adm)}
.prev-foto{width:110px;height:140px;object-fit:cover;border-radius:8px;border:1px solid var(--adm-line);margin-top:8px}
.chip-status{font-size:12px;color:var(--adm-mut)}
.pedido{border:1px solid var(--adm-line);border-radius:10px;padding:16px;margin-bottom:12px;background:#fff}
.pedido .det{display:none;margin-top:12px;border-top:1px dashed var(--adm-line);padding-top:12px;font-size:13px}
.pedido.aberto .det{display:block}
.swatches{display:flex;gap:8px;margin:8px 0}
.swatches button{width:38px;height:38px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #DCCDBB;cursor:pointer}
.swatches button.sel{box-shadow:0 0 0 2px var(--adm-dark)}
.ajuda-card h3{font-family:Georgia,serif;font-weight:400;font-size:19px;color:var(--adm-dark);margin-bottom:8px}
.ajuda-card ol{padding-left:20px;font-size:13.5px;color:#463426;line-height:1.9}
.vazio{text-align:center;padding:36px;color:var(--adm-mut);font-size:14px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px}
.pcard{background:var(--adm-card);border:1px solid var(--adm-line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 8px 22px -12px rgba(56,39,29,.18)}
.pimg{position:relative;aspect-ratio:3/4;background:#EEE4D8;overflow:hidden}
.pimg img{width:100%;height:100%;object-fit:cover;display:block}
.pimg .badge{position:absolute;top:6px;left:6px;font-size:9px;padding:3px 8px}
.pbody{padding:10px;display:flex;flex-direction:column;gap:5px;flex:1}
.pbody b{font-size:12px;color:#38271D;line-height:1.35}
.pinfo{font-size:11.5px;color:var(--adm-mut)}
.pbtns{display:flex;gap:5px;flex-wrap:wrap;margin-top:auto;padding-top:5px}
.pbtns .btn-mini{flex:1;text-align:center;white-space:nowrap;padding:6px 6px;font-size:11px}
.secao{display:none}
.secao.on{display:block;animation:entrar .35s ease}
@keyframes entrar{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.topo-mobile{display:none;background:var(--adm-dark);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:100}
.topo-mobile select{width:100%;padding:10px;border-radius:8px;border:0;font-size:14px}
@media(max-width:860px){
  .adm-shell{grid-template-columns:1fr}
  .adm-side{display:none}
  .topo-mobile{display:block}
  .galeria{grid-template-columns:repeat(4,1fr)}
  .tbl th:nth-child(1),.tbl td:nth-child(1){display:none}
}
/* Editor de produto: seções, prévia e atalhos */
.modal-fundo{align-items:center;padding:12px}
.modal.modal-mini{max-width:820px;padding:0;overflow:hidden}
.modal-mini .wiz-head{padding:18px 20px 12px;border-bottom:1px solid var(--adm-line);background:#fff}
.modal-mini .wiz-head h2{font-family:Georgia,serif;font-weight:400;color:var(--adm-dark);font-size:22px;margin:0}
.modal-mini .wiz-head p{margin:4px 0 0}
.modal-mini .wiz-body{padding:14px 16px;background:#F8F5F0;max-height:72vh;overflow-y:auto}
.modal-mini .wiz-foot{padding:12px 16px;border-top:1px solid var(--adm-line);background:#fff;display:flex;gap:8px;position:sticky;bottom:0}
.mini-layout{display:grid;grid-template-columns:1fr 230px;gap:14px;align-items:start}
.wiz-sec{background:#fff;border:1px solid var(--adm-line);border-radius:12px;padding:12px;margin-bottom:10px}
.wiz-sec h3{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--adm-dark);margin:0 0 10px;display:flex;align-items:center;gap:8px}
.wiz-sec h3 .n{width:20px;height:20px;border-radius:50%;background:var(--adm);color:#fff;font-size:11px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
.wiz-sec .hint{font-size:12px;color:var(--adm-mut);margin-top:6px;line-height:1.5}
.fld-req{color:#B3261E;font-weight:800}
.chip-pick{display:inline-flex;align-items:center;border:1px solid #DCCDBB;background:#fff;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer;color:#5A422F;margin:0 6px 6px 0}
.chip-pick.on{background:var(--adm-dark);border-color:var(--adm-dark);color:#fff}
.est-row{display:flex;gap:8px;align-items:center}
.est-row input{text-align:center}
.step-btn{width:38px;height:38px;border-radius:8px;border:1px solid #DCCDBB;background:#fff;font-size:18px;font-weight:800;cursor:pointer;color:#5A422F;flex:0 0 auto}
.step-btn:hover{background:#F2E8DC}
.switch-row{display:flex;gap:10px;align-items:center;background:#F8F5F0;border:1px dashed var(--adm-line);border-radius:8px;padding:8px 10px;margin-top:8px;font-size:13px;color:#5A422F}
.foto-drop{border:1.5px dashed #CBB89F;border-radius:10px;background:#FFFEFB;padding:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.mini-prev-card{border:1px solid var(--adm-line);border-radius:10px;overflow:hidden;background:#fff;position:sticky;top:0}
.mini-prev-card .mp-img{aspect-ratio:3/4;background:#EEE4D8;overflow:hidden}
.mini-prev-card .mp-img img{width:100%;height:100%;object-fit:cover;display:block}
.mini-prev-card .mp-body{padding:10px 10px 12px}
.mini-prev-card .mp-body b{display:block;font-size:12.5px;color:#38271D;line-height:1.35;min-height:34px}
.mini-prev-card .mp-cat{font-size:10px;letter-spacing:.08em;color:#9A8978;text-transform:uppercase}
.mini-prev-card .mp-preco{font-size:17px;font-weight:800;color:#38271D;margin-top:4px}
.mini-prev-card .mp-ant{font-size:11.5px;color:#9A8978;text-decoration:line-through}
.mini-prev-card .mp-est{font-size:11px;color:#857568;margin-top:2px}
@media(max-width:640px){.modal.modal-mini{max-width:480px}.mini-layout{grid-template-columns:1fr}.mini-prev-card{order:-1}.mini-prev-card .mp-img{aspect-ratio:16/9}}
.mini-grid{display:grid;grid-template-columns:1fr 110px 90px;gap:8px}
.mini-grid .form label{margin:8px 0 4px}
.mini-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.form.compacto label{margin:8px 0 4px}
.form.compacto input[type=text],.form.compacto input[type=number],.form.compacto select{padding:9px 10px;font-size:13.5px}
.fotos-mini{display:flex;gap:6px;overflow-x:auto;padding:6px 2px;max-width:100%}
.fotos-mini img{width:44px;height:56px;object-fit:cover;border-radius:6px;border:2px solid transparent;cursor:pointer;flex:0 0 auto}
.fotos-mini img.sel{border-color:var(--adm)}
.mini-top{display:flex;gap:10px;align-items:center}
.mini-prev{width:52px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--adm-line);flex:0 0 auto}
.wgal{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}
.wfoto{position:relative;aspect-ratio:3/4;border-radius:8px;overflow:hidden;border:2px solid transparent;background:#EEE4D8;cursor:grab}
.wfoto.capa{border-color:var(--adm)}
.wfoto img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.wfoto .xc{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:13px;line-height:1;cursor:pointer}
.wfoto .tagc{position:absolute;left:4px;bottom:4px;font-size:9px;font-weight:800;letter-spacing:.06em;background:var(--adm);color:#fff;border-radius:999px;padding:3px 8px;text-transform:uppercase}
.wfoto.arrast{opacity:.4}
.wfoto.loading{display:flex;align-items:center;justify-content:center;background:linear-gradient(100deg,#EFE7DB 40%,#F8F3EC 50%,#EFE7DB 60%);background-size:200% 100%;animation:wload 1.2s infinite;cursor:wait}
.wfoto.loading .spin{width:22px;height:22px;border-radius:50%;border:3px solid #DCCDBB;border-top-color:var(--adm);animation:girar .8s linear infinite}
@keyframes wload{to{background-position:-200% 0}}
@keyframes girar{to{transform:rotate(360deg)}}
details.mini-opt{margin-top:8px;border:1px dashed var(--adm-line);border-radius:8px;padding:8px 10px}
details.mini-opt summary{cursor:pointer;font-size:13px;font-weight:700;color:#5A422F}
/* Estoque: resumo + cartões + modal de movimentação */
.est-resumo{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.est-box{background:var(--adm-card);border:1px solid var(--adm-line);border-radius:10px;padding:12px;text-align:center}
.est-box b{display:block;font-size:22px;color:var(--adm-dark)}
.est-box span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--adm-mut);font-weight:700}
.est-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:12px}
.est-card{background:var(--adm-card);border:1px solid var(--adm-line);border-radius:12px;padding:0;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 8px 22px -14px rgba(56,39,29,.25)}
.est-foto-wrap{position:relative;background:#EEE4D8;aspect-ratio:4/3;overflow:hidden}
.est-foto-wrap .pfoto{width:100%;height:100%;border:0;border-radius:0;object-fit:cover}
.est-foto-wrap .badge{position:absolute;top:8px;left:8px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.est-foto-wrap .est-mais{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(56,39,29,.85);color:#fff;font-size:16px;font-weight:800;cursor:pointer;line-height:1}
.est-info{flex:1;min-width:0;padding:10px 12px 0}
.est-info b{display:block;font-size:13px;color:#38271D;line-height:1.4;min-height:36px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.est-num{font-size:12.5px;color:#5A422F;margin:6px 0 2px;display:flex;align-items:center;gap:6px}
.est-num b{font-size:17px;display:inline;color:#38271D}
.est-bar{height:6px;background:#F1E7DA;border-radius:99px;overflow:hidden;margin:6px 0 10px}
.est-bar i{display:block;height:100%;background:var(--adm);border-radius:99px}
.est-acoes{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:0 12px 12px}
.est-acoes .btn-mini{margin:0;text-align:center;padding:9px 6px}
.est-acoes .btn-add{grid-column:1/-1;background:var(--adm-dark);color:#fff;border-color:var(--adm-dark)}
.est-acoes .btn-add:hover{background:#5a412f}
.est-modal{max-width:420px;width:100%;margin:0 auto;text-align:center}
.est-modal .est-prod,.est-modal .est-prev{text-align:left}
.est-modal .est-prod .badge{margin-left:auto}
/* Banners só-imagem: cards + editor ampliado */
.banner-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin:14px 0}
.banner-card{border:1px solid var(--adm-line);border-radius:12px;overflow:hidden;background:#FBF7F1;padding:0;text-align:left;cursor:pointer;transition:transform .18s,box-shadow .18s,border-color .18s}
.banner-card:hover{transform:translateY(-2px);border-color:#B99A7B;box-shadow:0 12px 24px -16px rgba(56,39,29,.45)}
.banner-card-thumb{border:0;background:#EEE4D8;aspect-ratio:16/7;display:flex;align-items:center;justify-content:center;overflow:hidden}
.banner-card-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.banner-card-info{padding:10px 11px;display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--adm-dark);font-size:13px}
.banner-card-info small{color:var(--adm-mut);font-size:11px;white-space:nowrap}
.banner-prev{border:1px solid var(--adm-line);border-radius:10px;overflow:hidden;background:#EEE4D8;aspect-ratio:16/7;display:flex;align-items:center;justify-content:center}
.banner-prev img{width:100%;height:100%;object-fit:cover;display:block}
.banner-vazio{text-align:center;color:var(--adm-mut);font-size:13px;line-height:1.6;padding:20px;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;width:100%}
.banner-vazio .spin{width:24px;height:24px;border-radius:50%;border:3px solid #DCCDBB;border-top-color:var(--adm);animation:girar .8s linear infinite}
.modal.banner-modal-box{max-width:980px}
.banner-editor-modal{padding:0!important}
.banner-editor-modal h2{font-family:Georgia,serif;font-weight:400;color:var(--adm-dark);margin:0}
.banner-editor-modal .banner-prev{aspect-ratio:21/8;max-height:440px}
@media(max-width:640px){.banner-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.banner-card-info{padding:8px;font-size:12px}.banner-card-info small{font-size:10px}.banner-editor-modal{padding:18px!important}}
/* Promoções: formulário + tickets */
.promo-layout{display:grid;grid-template-columns:360px 1fr;gap:14px;align-items:start}
.promo-ticket{background:var(--adm-card);border:1.5px dashed #CBB89F;border-radius:12px;padding:14px;position:relative}
.promo-ticket.vencido{opacity:.65;border-color:#E5AAAA}
.promo-code{font-size:18px;font-weight:800;letter-spacing:.08em;color:#38271D;background:#F8F5F0;border:1px solid var(--adm-line);border-radius:8px;padding:8px 10px;text-align:center;margin:8px 0}
.promo-desc{font-size:15px;font-weight:800;color:#78583E}
.promo-meta{font-size:12px;color:var(--adm-mut);margin-top:4px}
.promo-acoes{display:flex;gap:6px;margin-top:10px}
.promo-acoes .btn-mini{flex:1;margin:0;text-align:center}
.tipo-seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tipo-seg button{border:1px solid #DCCDBB;background:#fff;border-radius:8px;padding:10px;font-size:13px;font-weight:800;cursor:pointer;color:#5A422F}
.tipo-seg button.on{background:var(--adm-dark);color:#fff;border-color:var(--adm-dark)}
.quick-cups{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
@media(max-width:860px){.promo-layout{grid-template-columns:1fr}}
.est-prod{display:flex;gap:12px;align-items:center;background:#F8F5F0;border:1px solid var(--adm-line);border-radius:10px;padding:10px;margin:12px 0}
.est-prod img{width:48px;height:60px;object-fit:cover;border-radius:8px;border:1px solid var(--adm-line)}
.est-step{display:flex;gap:8px;align-items:center;justify-content:center;margin:10px 0}
.est-step input{width:90px;text-align:center;font-size:20px;font-weight:800;padding:10px;border:1px solid #DCCDBB;border-radius:10px}
.qchips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:10px}
.qchip{border:1px solid #DCCDBB;background:#fff;border-radius:999px;padding:8px 14px;font-size:13px;font-weight:800;cursor:pointer;color:#5A422F}
.qchip.on{background:var(--adm-dark);color:#fff;border-color:var(--adm-dark)}
.est-prev{text-align:center;font-size:14px;color:#463426;background:#F8F5F0;border-radius:8px;padding:10px;margin-bottom:4px}
.est-prev b{color:var(--adm-dark)}
@media(max-width:640px){.est-resumo{grid-template-columns:1fr 1fr 1fr}.est-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.est-info b{font-size:12px;min-height:34px}.est-acoes{grid-template-columns:1fr 1fr}}
/* Os estilos globais da loja vêm antes deste bloco, então os botões do painel
   precisam usar explicitamente as variáveis do tema administrativo. */
.btn-rosa,.btn-preto{background:var(--adm)!important;border-color:var(--adm)!important;color:#fff!important}
.btn-rosa:hover,.btn-preto:hover{background:var(--adm-dark)!important;border-color:var(--adm-dark)!important}
.btn-borda{background:transparent!important;border-color:var(--adm)!important;color:var(--adm-dark)!important}
.btn-borda:hover{background:var(--adm)!important;border-color:var(--adm)!important;color:#fff!important}
 .btn-mini{border-color:var(--adm-line);color:var(--adm-dark)}
 .btn-mini:hover{background:var(--adm-bg)}
 /* Cards de produtos: leitura limpa e botões sem quebra estranha. */
 .pgrid{grid-template-columns:repeat(auto-fill,minmax(175px,210px));gap:12px;align-items:start}
 .pcard{border-radius:14px;box-shadow:0 8px 24px rgba(56,39,29,.12);transition:transform .18s ease,box-shadow .18s ease}
 .pcard:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(56,39,29,.16)}
 .pimg{aspect-ratio:4/5;background:#eee6dc}
 .pbody{padding:10px;gap:5px}
 .pbody>b{font-size:11.5px;letter-spacing:.02em;text-transform:uppercase}
 .pbody .chip-status{font-size:10px;background:var(--adm-bg);border-radius:5px;padding:3px 6px;width:max-content;max-width:100%;overflow:hidden;text-overflow:ellipsis}
 .pinfo{font-size:10.5px;line-height:1.35}
 .pbtns{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:6px;padding-top:6px;border-top:1px solid var(--adm-line)}
 .pbtns .btn-mini{padding:6px 4px;font-size:10px;border-radius:6px}
 .pbtns .btn-mini.perigo{grid-column:1/-1}
 .desc-editor{border:1px solid #DCCDBB;border-radius:8px;background:#fff;overflow:hidden}
 .desc-toolbar{display:flex;align-items:center;gap:5px;flex-wrap:wrap;padding:7px;border-bottom:1px solid #E6DCCF;background:#F8F5F0}
 .desc-toolbar button{border:1px solid #DCCDBB;background:#fff;color:#463426;border-radius:5px;min-width:30px;height:28px;cursor:pointer;font-weight:700}
 .desc-toolbar button:hover{background:var(--adm-bg);border-color:var(--adm)}
 .desc-toolbar select{height:30px;min-width:92px;padding:0 7px;border:1px solid #DCCDBB;border-radius:5px;background:#fff!important;color:#463426!important;font-size:12px;line-height:28px;appearance:auto;opacity:1}
 .desc-toolbar select option{background:#fff;color:#463426}
 .desc-toolbar input{height:28px;border:1px solid #DCCDBB;border-radius:5px;background:#fff;color:#463426}
 .desc-editable{min-height:150px;padding:12px;outline:0;font-size:14px;line-height:1.6;white-space:pre-wrap}
 .desc-editable:empty:before{content:attr(data-placeholder);color:#9A8978}
 .mp-desc{margin-top:9px;padding-top:8px;border-top:1px solid #E6DCCF;color:#6f6258;font-size:11px;line-height:1.45;max-height:105px;overflow:auto;word-break:break-word}
 .mp-desc p{margin:0 0 5px}.mp-desc ul,.mp-desc ol{padding-left:18px;margin:4px 0}
 .whatsapp-editor{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,.8fr);gap:18px;align-items:start}
 .wa-msg{min-height:420px;height:420px;resize:vertical;font-size:14px;line-height:1.5}
 .wa-placeholders{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
 .wa-presets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:8px 0 14px}
 .wa-preset{border:1px solid var(--adm-line);background:var(--adm-bg);color:var(--adm-dark);border-radius:8px;padding:10px 8px;cursor:pointer;font-size:12px;font-weight:700;text-align:center}
 .wa-preset:hover{background:color-mix(in srgb,var(--adm) 18%,white);border-color:var(--adm)}
 .wa-placeholder{border:1px solid var(--adm-line);background:var(--adm-bg);color:var(--adm-dark);border-radius:999px;padding:7px 10px;cursor:pointer;font-size:12px;font-weight:700}
 .wa-placeholder:hover{background:color-mix(in srgb,var(--adm) 18%,white);border-color:var(--adm);color:var(--adm-dark)}
 .wa-phone{width:320px;max-width:100%;height:580px;margin:auto;position:relative;background:#111;border:8px solid #17191b;border-radius:34px;overflow:hidden;box-shadow:0 14px 32px rgba(0,0,0,.28);padding:7px}
 .wa-screen{width:100%;height:100%;border-radius:24px;overflow:hidden;background:#efeae2;display:flex;flex-direction:column;position:relative}
 .wa-screen:before{content:"";position:absolute;z-index:3;top:0;left:50%;transform:translateX(-50%);width:88px;height:20px;background:#17191b;border-radius:0 0 14px 14px}
 .wa-phone-head{height:62px;flex:0 0 62px;background:#075e54;color:#fff;display:flex;align-items:center;gap:10px;padding:0 14px;font-size:13px;font-weight:700}
 .wa-phone-avatar{width:34px;height:34px;border-radius:50%;background:#25d366;color:#fff;display:grid;place-items:center;font-size:16px;overflow:hidden}
 .wa-phone-avatar img{width:100%;height:100%;object-fit:cover}
 .wa-phone-status{display:block;font-size:10px;font-weight:400;opacity:.8;margin-top:2px}
 .wa-chat{margin:16px 10px;background:#d9fdd3;border-radius:8px;padding:11px;color:#202124;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word;line-height:1.45;font-size:13px;box-shadow:0 1px 1px rgba(0,0,0,.12);position:relative;align-self:stretch;overflow-x:hidden;overflow-y:auto;min-width:0}
 .wa-chat:after{content:"";position:absolute;right:-7px;top:0;border-style:solid;border-width:0 0 9px 9px;border-color:transparent transparent transparent #d9fdd3}
 @media(max-width:760px){.whatsapp-editor{grid-template-columns:1fr}}
 .info-texto.info-desabilitado{background:#eeeeee!important;border-color:#d2d2d2!important;color:#999!important;cursor:not-allowed;opacity:.8}
 .check-info{display:flex;align-items:center;gap:8px;color:var(--adm-mut);font-size:12px!important;margin:6px 0 14px!important;cursor:pointer}
 .check-info.info-desabilitado{color:#aaa!important}
 .check-info input{width:auto!important;margin:0;accent-color:var(--adm)}
 #avisoNaoSalvo{display:none;position:fixed;right:18px;bottom:18px;z-index:300;background:#B3261E;color:#fff;border-radius:8px;padding:12px 16px;box-shadow:0 8px 24px rgba(80,0,0,.28);font-size:13px;font-weight:800;max-width:320px;line-height:1.35}
 #avisoNaoSalvo button{display:block;width:100%;margin-top:9px;border:0;border-radius:6px;background:#43A047;color:#fff;padding:9px 12px;font-size:12px;font-weight:900;letter-spacing:.04em;cursor:pointer}
 #avisoNaoSalvo button:hover{background:#2E7D32}
 #avisoNaoSalvo.mostrar{display:block;animation:avisoEntrar .2s ease}
 @keyframes avisoEntrar{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
 @media(max-width:640px){#avisoNaoSalvo{right:10px;bottom:10px;left:10px;max-width:none;text-align:center}}
</style>

<body>

<div class="login-card" id="telaLogin">
  <img src="../assets/img/logo.png" alt="Encanto Miranda">
  <h1>Painel da Loja</h1>
  <p>Área restrita para quem cuida da loja.</p>
  <div class="login-erro" id="loginErro">Usuário ou senha errados. Tente de novo.</div>
  <form id="formLogin" autocomplete="off">
    <div class="campo"><label>E-mail</label><input id="loginUser" placeholder="voce@sualoja.com" autocomplete="username"></div>
    <div class="campo"><label>Senha</label><input id="loginPass" type="password" placeholder="••••••••" autocomplete="current-password"></div>
    <button class="btn btn-preto btn-grande" type="submit" style="width:100%;margin-top:6px">Entrar</button>
  </form>
  <div class="login-dica">Use o e-mail e a senha do administrador.</div>
</div>

<div id="app">
  <div class="topo-mobile"><select id="navMobile" aria-label="Menu"></select></div>
  <div class="adm-shell">
    <aside class="adm-side">
      <div class="logo"><img src="../assets/img/logo.png" alt=""></div>
      <small>PAINEL DA LOJA</small>
      <nav class="adm-nav" id="admNav"></nav>
    </aside>
    <div class="adm-main" id="admMain"></div>
  </div>
</div>

<div class="modal-fundo" id="modalFundo"><div class="modal" id="modalBox"></div></div>
<div id="avisoNaoSalvo" role="status" aria-live="polite">⚠ Você tem alterações não salvas!<button type="button" onclick="salvarTudoAviso()">SALVAR TUDO</button></div>

<script src="../assets/js/data.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>window.supabase||document.write('<script src="https://unpkg.com/@supabase/supabase-js@2"><\/script>')</script>
<script src="../assets/js/supabase.js?v=2"></script>
<script src="../assets/js/loja-db.js?v=9"></script>
<script src="../assets/js/main.js?v=7"></script>
<script>
const MENU = [
  { id: 'inicio', nome: 'Início', icone: '⌂' },
  { id: 'produtos', nome: 'Produtos', icone: '◈' },
  { id: 'categorias', nome: 'Categorias', icone: '▤' },
  { id: 'estoque', nome: 'Estoque', icone: '▦' },
  { id: 'personalizar', nome: 'Personalizar site', icone: '✎' },
  { id: 'whatsapp', nome: 'WhatsApp', icone: '◉' },
  { id: 'promocoes', nome: 'Promoções', icone: '%' },
  { id: 'config', nome: 'Configurações', icone: '⚙' },
  { id: 'testes', nome: 'Testes', icone: '✓' },
  { id: 'ajuda', nome: 'Ajuda', icone: '?' }
];
let TELA = 'inicio';
const $ = s => document.querySelector(s);
// Código curto para mostrar à cliente; o ID técnico do banco continua interno.
function codigoProduto(id) {
  const s = String(id == null ? '' : id);
  if (/^p\d+$/i.test(s)) return 'P' + s.slice(1);
  let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  return 'P' + (h % 60466176).toString(36).toUpperCase().padStart(5, '0');
}
function mostrarAvisoNaoSalvo() {
  const el = document.getElementById('avisoNaoSalvo');
  if (el) el.classList.add('mostrar');
}
function ocultarAvisoNaoSalvo() {
  const el = document.getElementById('avisoNaoSalvo');
  if (el) el.classList.remove('mostrar');
}
function salvarTudoAviso() {
  try {
    if (TELA === 'personalizar' && typeof salvarPersonalizar === 'function') return salvarPersonalizar();
    if (TELA === 'whatsapp' && typeof salvarWhatsapp === 'function') return salvarWhatsapp();
    if (TELA === 'config' && typeof salvarPag === 'function') return salvarPag();
    if (typeof WIZ !== 'undefined' && WIZ && document.getElementById('modalFundo').classList.contains('aberto')) return salvarWizard(false);
    toast('Use o botão de salvar da seção atual.');
  } catch { toast('Não consegui salvar. Confira os campos.'); }
}
// Detecta edições mesmo em formulários que são recriados pelo painel.
document.addEventListener('input', e => {
  if (!e.target.closest('#app')) return;
  if (['qEst', 'cupVen'].includes(e.target.id) && TELA === 'estoque') return;
  mostrarAvisoNaoSalvo();
}, true);
document.addEventListener('change', e => {
  if (e.target.closest('#app')) mostrarAvisoNaoSalvo();
}, true);
// Alguns controles alteram dados sem disparar input (chips, banners e extras).
document.addEventListener('click', e => {
  const b = e.target.closest('#app button');
  if (!b) return;
  const acao = b.getAttribute('onclick') || '';
  if (/trocarCor|alternarTam|alternarCor|mudaEst|removerFoto|removerFotoIdx|moverBanner|addBanner|delBanner|bannerRemoveFoto|addPagExtra|removePagExtra|modeloCupom|setTipoCup|setQtdEst/.test(acao)) mostrarAvisoNaoSalvo();
}, true);
const fotoSrc = p => {
  try {
    if (p && Array.isArray(p.fotos) && p.fotos[0]) {
      const f = p.fotos[0];
      if (f.startsWith('data:') || f.startsWith('http')) return f;
      return '../' + String(f).replace(/^\.\.\//, '');
    }
    if (p && typeof p.foto === 'string' && p.foto.trim().startsWith('[')) {
      try { const a = JSON.parse(p.foto); if (a[0]) { const f = a[0]; if (f.startsWith('data:') || f.startsWith('http')) return f; return '../' + String(f).replace(/^\.\.\//, ''); } } catch {}
    }
  } catch {}
  if (p && p.foto) {
    if (p.foto.startsWith('data:') || p.foto.startsWith('http')) return p.foto;
    return '../' + p.foto.replace(/^\.\.\//, '');
  }
  try { if (typeof DB !== 'undefined' && DB.semFoto) return DB.semFoto; } catch {}
  return 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="300" height="400"><rect width="300" height="400" fill="#EEE4D8"/><text x="150" y="195" font-family="Georgia,serif" font-size="22" fill="#9A8978" text-anchor="middle">Sem foto</text></svg>');
};
const GALERIA = [];
const dataFmt = iso => { try { return new Date(iso).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }); } catch { return ''; } };
const statusPed = s => ({ 'Novo': 'lanc', 'Em preparação': 'baixo', 'Enviado': 'promo', 'Concluído': 'ok', 'Cancelado': 'zero' }[s] || '');

// ---------- login (de verdade, na nuvem; com reserva local sem internet) ----------
$('#formLogin').addEventListener('submit', async e => {
  e.preventDefault();
  const id = $('#loginUser').value.trim();
  const pw = $('#loginPass').value;
  $('#loginErro').style.display = 'none';
  if (typeof SB !== 'undefined' && SB.ok()) {
    try {
      const r = await SB.login(id, pw);
      if (!r.erro) { sessionStorage.setItem('em_admin', '1'); entrar(); return; }
      if (r.erro !== 'Sem conexão com a nuvem.') { $('#loginErro').textContent = r.erro; $('#loginErro').style.display = 'block'; return; }
    } catch {}
  }
  if ((id === 'admin' || id === 'admin@encantomiranda.com.br') && pw === (localStorage.getItem('em_admin_pass') || 'encanto123')) {
    sessionStorage.setItem('em_admin', '1');
    entrar();
    toast('Sem internet: entrando neste aparelho.');
  } else { $('#loginErro').textContent = 'E-mail ou senha errados. Tente de novo.'; $('#loginErro').style.display = 'block'; }
});
async function entrar() {
  await DB.ready;
  aplicarCorAdmin(DB.getSettings().cor);
  $('#telaLogin').style.display = 'none';
  $('#app').style.display = 'block';
  $('#admNav').innerHTML = MENU.map(m => `<button data-tela="${m.id}"><i>${m.icone}</i>${m.nome}</button>`).join('') +
    `<div style="border-top:1px solid #4A3525;margin:12px 0"></div>
     <button data-acao="verloja"><i>○</i>Ver minha loja</button>
     <button data-acao="sair"><i>×</i>Sair</button>`;
  $('#navMobile').innerHTML = MENU.map(m => `<option value="${m.id}">${m.nome}</option>`).join('');
  // selo de modo: nuvem conectada ou só neste aparelho
  (async () => {
    let nuvem = false;
    try { if (typeof SB !== 'undefined' && SB.ok() && await SB.session()) nuvem = true; } catch {}
    const el = document.querySelector('.adm-side small');
    if (el) { el.textContent = nuvem ? '● NUVEM CONECTADA' : '● SÓ NESTE APARELHO'; el.style.color = nuvem ? '#9FD6A4' : '#E8B34B'; }
  })();
  // ao entrar, manda a fila pendente e busca o novo da nuvem
  try { if (typeof DB !== 'undefined' && DB.sincronizar) DB.sincronizar().then(mudou => { if (mudou) RENDER[TELA](); checaNuvem(); }).catch(() => {}); } catch {}
  setTimeout(checaNuvem, 6000);
  armaSyncAdmin();
  ir('inicio');
}
async function checaNuvem() {
  let ok = false;
  try { if (typeof SB !== 'undefined' && SB.ok() && await SB.session()) ok = true; } catch {}
  let bar = document.getElementById('barraNuvem');
  if (ok) { if (bar) bar.remove(); return; }
  if (!bar) {
    bar = document.createElement('div');
    bar.id = 'barraNuvem';
    bar.style.cssText = 'background:#8F2B2B;color:#fff;font-size:13px;font-weight:700;padding:10px 16px;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap';
    document.getElementById('app').prepend(bar);
  }
  bar.innerHTML = 'SEM LOGIN NA NUVEM — mudanças ficam só neste aparelho. <button id="btnEntrarNuvem" style="background:#fff;color:#8F2B2B;border:0;border-radius:6px;padding:8px 16px;font-weight:800;cursor:pointer">Entrar agora</button>';
  document.getElementById('btnEntrarNuvem').addEventListener('click', async () => {
    try { if (typeof SB !== 'undefined' && SB.ok()) await SB.logout(); } catch {}
    sessionStorage.removeItem('em_admin');
    location.reload();
  });
}
// força envio da fila + busca da nuvem, com retorno visível
async function sincAgora() {
  toast('Sincronizando...');
  try {
    const mudou = await DB.sincronizar();
    try { if (typeof DB.pendencias === 'function' && DB.pendencias() > 0) { toast('Ainda há pendências. Confira login e internet.'); RENDER[TELA](); return; } } catch {}
    toast(mudou ? 'Pronto! Lista atualizada.' : 'Tudo certo, nada novo.');
    RENDER[TELA]();
  } catch { toast('Falha. Confira internet e login.'); }
}
// quando algo muda na nuvem (outro aparelho), atualiza sozinho — sem apagar o que está digitando
function armaSyncAdmin() {
  window.__syncRender = function () {
    try {
      const el = document.activeElement;
      const digitando = el && /INPUT|TEXTAREA|SELECT/.test(el.tagName);
      const modal = document.getElementById('modalFundo').classList.contains('aberto');
      if (!digitando && !modal) RENDER[TELA]();
    } catch {}
  };
}
document.addEventListener('click', e => {
  const b = e.target.closest('#admNav button');
  if (!b) return;
  if (b.dataset.acao === 'sair') { (async () => { try { if (typeof SB !== 'undefined' && SB.ok()) await SB.logout(); } catch {} sessionStorage.removeItem('em_admin'); location.reload(); })(); return; }
  if (b.dataset.acao === 'verloja') { window.open('../index.html', '_blank'); return; }
  ir(b.dataset.tela);
});
$('#navMobile').addEventListener('change', e => ir(e.target.value));
function ir(tela) {
  TELA = tela;
  document.querySelectorAll('#admNav button').forEach(b => b.classList.toggle('ativo', b.dataset.tela === tela));
  $('#navMobile').value = tela;
  RENDER[tela]();
  window.scrollTo(0, 0);
}

// ---------- modal ----------
function abrirModal(html) { $('#modalBox').classList.remove('banner-modal-box'); $('#modalBox').innerHTML = html; $('#modalFundo').classList.add('aberto'); }
function fecharModal() {
  $('#modalFundo').classList.remove('aberto');
  $('#modalBox').classList.remove('banner-modal-box');
  // se tinha um popup com promessa pendente e fechou pelo X/fundo/ESC, resolve como cancelado
  try { if (window.__popCanc) { const c = window.__popCanc; window.__popCanc = null; c(); } } catch {}
}
$('#modalFundo').addEventListener('click', e => { if (e.target.id === 'modalFundo') fecharModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && document.getElementById('modalFundo').classList.contains('aberto')) fecharModal(); });

// ---------- popups do site (substituem confirm/prompt do navegador) ----------
function popupConfirm(o) {
  o = o || {};
  const titulo = o.titulo || 'Tem certeza?';
  const texto = o.texto || '';
  const okTxt = o.ok || 'Confirmar';
  const cancelTxt = o.cancelar || 'Cancelar';
  const perigo = !!o.perigo;
  return new Promise(resolve => {
    window.__popCanc = () => resolve(false);
    abrirModal(`<h2 style="font-family:Georgia,serif;font-weight:400;color:#38271D;margin-bottom:8px">${titulo}</h2>`
      + (texto ? `<p style="font-size:14px;color:#463426;line-height:1.6;margin-bottom:6px">${texto}</p>` : '')
      + `<div style="display:flex;gap:10px;margin-top:20px;flex-wrap:wrap">`
      + `<button class="btn btn-borda" id="popCancel" style="flex:1">${cancelTxt}</button>`
      + `<button class="btn ${perigo ? '' : 'btn-preto'}" id="popOk" style="flex:1;${perigo ? 'background:#8F2B2B;color:#fff;border:0;border-radius:8px;padding:12px 18px;font-weight:700;cursor:pointer' : ''}">${okTxt}</button></div>`);
    const okB = document.getElementById('popOk'), cB = document.getElementById('popCancel');
    if (cB) cB.onclick = () => { window.__popCanc = null; fecharModal(); resolve(false); };
    if (okB) { okB.onclick = () => { window.__popCanc = null; fecharModal(); resolve(true); }; setTimeout(() => { try { okB.focus(); } catch {} }, 50); }
  });
}
function popupPrompt(o) {
  o = o || {};
  const titulo = o.titulo || 'Digite';
  const texto = o.texto || '';
  const valor = (o.valor !== undefined && o.valor !== null) ? String(o.valor) : '';
  const place = o.placeholder || '';
  const tipo = o.tipo || 'text';
  const okTxt = o.ok || 'Salvar';
  return new Promise(resolve => {
    window.__popCanc = () => resolve(null);
    const esc = s => String(s).replace(/"/g, '&quot;');
    abrirModal(`<h2 style="font-family:Georgia,serif;font-weight:400;color:#38271D;margin-bottom:8px">${titulo}</h2>`
      + (texto ? `<p style="font-size:14px;color:#463426;margin-bottom:6px">${texto}</p>` : '')
      + `<div class="form"><input id="popInput" type="${tipo}" value="${esc(valor)}" placeholder="${esc(place)}" style="font-size:16px"></div>`
      + `<div style="display:flex;gap:10px;margin-top:18px;flex-wrap:wrap">`
      + `<button class="btn btn-borda" id="popCancel" style="flex:1">Cancelar</button>`
      + `<button class="btn btn-preto" id="popOk" style="flex:1">${okTxt}</button></div>`);
    const inp = document.getElementById('popInput'), okB = document.getElementById('popOk'), cB = document.getElementById('popCancel');
    const fim = v => { window.__popCanc = null; fecharModal(); resolve(v); };
    if (cB) cB.onclick = () => fim(null);
    const okFn = () => fim(inp ? inp.value : '');
    if (okB) okB.onclick = okFn;
    if (inp) {
      setTimeout(() => { try { inp.focus(); inp.select(); } catch {} }, 50);
      inp.addEventListener('keydown', e => { if (e.key === 'Enter') okFn(); });
    }
  });
}

// ---------- INÍCIO ----------
function rInicio() {
  const baixo = DB.listProducts(false).filter(p => (p.estoque || 0) > 0 && (p.estoque || 0) <= 5);
  const esgot = DB.listProducts(false).filter(p => !(p.estoque > 0));
  const total = DB.listProducts(false).length;
  const pend = (typeof DB !== 'undefined' && DB.pendencias) ? DB.pendencias() : 0;
  $('#admMain').innerHTML = `<div class="secao on"><h2>Olá! Como está sua loja hoje?</h2><p class="adm-sub">Tudo importante num só lugar.</p>
  <div class="card">
    <div class="frase">Você tem <b>${total} produto(s)</b> na loja.</div>
    <div class="frase">${baixo.length ? `<b>${baixo.length} produto(s)</b> com estoque baixo: ${baixo.slice(0, 3).map(p => p.nome).join(' · ')}${baixo.length > 3 ? '...' : ''}` : 'Nenhum produto com estoque baixo.'}</div>
    <div class="frase">${esgot.length ? `<b>${esgot.length} produto(s) esgotado(s).</b> Que tal repor?` : 'Nenhum produto esgotado.'}</div>
    ${pend ? `<div class="frase" style="background:#FDF3E7;border-radius:8px;padding:10px 12px">⚠ <b>${pend} mudança(s)</b> neste aparelho ainda não subiram para a nuvem. Confira internet e login. <button class="btn-mini" onclick="sincAgora()">Sincronizar agora</button></div>` : ''}
    <div class="atalhos">
      <button class="btn btn-preto" onclick="ir('produtos');setTimeout(()=>novoProduto(),50)">+ Adicionar produto</button>
      <button class="btn btn-borda" onclick="ir('estoque')">Ver estoque</button>

// ---------- PRODUTOS ----------
let buscaP = '', filtroStatus = '', filtroCatP = '';
function rProdutos() {
  const codigo = id => { const s = String(id == null ? '' : id); if (/^p\d+$/i.test(s)) return 'P' + s.slice(1); let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0; return 'P' + (h % 60466176).toString(36).toUpperCase().padStart(5, '0'); };
  const catsP = DB.listCategories();
  const fcP = (typeof filtroCatP !== 'undefined' ? filtroCatP : '');
  const lista = DB.listProducts(true).filter(p =>
    (!buscaP || (p.nome + ' ' + (p.tecido || '') + ' ' + codigo(p.id)).toLowerCase().includes(buscaP)) &&
    (!fcP || String(p.cat || '') === String(fcP)) &&
    (!filtroStatus || (filtroStatus === 'rascunho' ? p.rascunho : !p.rascunho)));
  const badgeEst = p => !(p.estoque > 0) ? '<span class="badge zero">Esgotado</span>' : (p.estoque <= 5 ? `<span class="badge baixo">${p.estoque} un.</span>` : `<span class="badge ok">${p.estoque} un.</span>`);
  $('#admMain').innerHTML = `<div class="secao on"><h2>Produtos</h2><p class="adm-sub">Tudo que sua loja vende está aqui.</p>
   <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px"><button class="btn btn-preto btn-grande" onclick="novoProduto()">+ Adicionar produto</button><button class="btn btn-borda" onclick="abrirDestaquesMassa()">★ Gerenciar destaques</button>
  </div>
  <div class="toolbar"><input id="q" placeholder="🔍 Procurar pelo nome..." value="${buscaP.replace(/"/g, '')}">
  <select id="fc"><option value="">Todas as categorias</option>${catsP.map(c => `<option value="${c.slug}" ${fcP === c.slug ? 'selected' : ''}>${c.nome}</option>`).join('')}</select>
  <select id="fs"><option value="">Tudo</option><option value="pub" ${filtroStatus === 'pub' ? 'selected' : ''}>Publicados</option><option value="rascunho" ${filtroStatus === 'rascunho' ? 'selected' : ''}>Rascunhos</option></select></div>
  <div class="pgrid">
  ${lista.map(p => `<div class="pcard" data-id="${p.id}">
     <div class="pimg"><img src="${fotoSrc(p)}" alt="" loading="lazy">${p.rascunho ? '<span class="badge">Rascunho</span>' : ''}${p.destaque ? '<span class="badge ok" style="position:absolute;right:6px;top:6px">★ Destaque</span>' : ''}</div>
     <div class="pbody"><b>${p.nome}</b><div class="chip-status" style="font-size:11px">ID: ${codigo(p.id)}</div>
      <div class="pinfo"><b style="font-size:14px">${BRL(p.preco)}</b>${p.antigo ? ' · de ' + BRL(p.antigo) : ''}</div>
      <div class="pinfo">${(p.cat || '').toUpperCase()} · ${badgeEst(p)} · <span data-origem class="chip-status">…</span></div>
      <div class="pbtns"><button class="btn-mini" onclick="editarProduto('${p.id}')">Editar</button><button class="btn-mini" onclick="duplicarProduto('${p.id}')">Duplicar</button><button class="btn-mini perigo" onclick="excluirProduto('${p.id}')">Excluir</button></div>
    </div>
  </div>`).join('') || '<div class="vazio">Nenhum produto encontrado.</div>'}
  </div></div>`;
  $('#q').addEventListener('input', e => { buscaP = e.target.value.toLowerCase(); const v = e.target.selectionStart; rProdutos(); const nq = $('#q'); nq.focus(); nq.setSelectionRange(v, v); });
  $('#fc').addEventListener('change', e => { filtroCatP = e.target.value; rProdutos(); });
  $('#fs').addEventListener('change', e => { filtroStatus = e.target.value; rProdutos(); });
  marcaOrigem();
}
// mostra em cada card se já está na nuvem ou só neste aparelho
async function marcaOrigem() {
  try {
    if (typeof SB === 'undefined' || !SB.ok()) return;
    const linhas = await Promise.race([SB.ler('produtos'), new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 9000))]);
    const naNuvem = new Set((linhas || []).map(r => String(r.id)));
    document.querySelectorAll('#admMain .pcard[data-id]').forEach(card => {
      const b = card.querySelector('[data-origem]');
      if (!b) return;
      if (naNuvem.has(String(card.getAttribute('data-id')))) { b.textContent = 'Nuvem'; b.className = 'badge ok'; }
      else { b.textContent = 'Só aqui'; b.className = 'badge baixo'; b.title = 'Ainda não subiu para a nuvem'; }
    });
  } catch {}
}

// wizard do produto em 4 passos
let WIZ = null;
function fotosDoWiz() { if (WIZ && Array.isArray(WIZ.fotos) && WIZ.fotos.length) return WIZ.fotos; if (WIZ && WIZ.foto) return [WIZ.foto]; return []; }
function fotosProntas() { try { return fotosDoWiz().filter(f => typeof f === 'string' && f); } catch { return []; } }
function novoProduto() { WIZ = { id: null, nome: '', preco: '', parcelas: '6', cat: (DB.listCategories()[0] || {}).slug || '', foto: '', fotos: [], estoque: '10', semEstoque: false, destaque: false, tamsTxt: 'P, M, G', coresTxt: '', desc: '', antigo: '' }; desenharWizard('Adicionar produto'); }
function editarProduto(id) {
  const p = DB.getProduct(id);
  if (!p) return;
  let arr = [];
  if (Array.isArray(p.fotos) && p.fotos.length) arr = p.fotos.slice();
  else if (p && typeof p.foto === 'string' && p.foto.trim().startsWith('[')) { try { const a = JSON.parse(p.foto); if (Array.isArray(a)) arr = a.filter(Boolean); } catch {} }
  else if (p.foto) arr = [p.foto];
  arr = arr.map(f => (typeof f === 'string' && !f.startsWith('data:') && !f.startsWith('http') && !f.startsWith('../') && !f.startsWith('assets/')) ? '../' + f : f);
  WIZ = { id, nome: p.nome, preco: p.preco, parcelas: p.parcelas ?? 6, cat: p.cat, foto: arr[0] || '', fotos: arr, estoque: p.estoque, semEstoque: (p.estoque || 0) >= 9999, destaque: p.destaque === true, tamsTxt: (p.tams || []).join(', '), coresTxt: (p.cores || []).join(', '), desc: p.desc || '', antigo: p.antigo ?? '' };
  if (WIZ.foto && !WIZ.foto.startsWith('data:') && !WIZ.foto.startsWith('http') && !WIZ.foto.startsWith('../')) WIZ.foto = '../' + WIZ.foto;
  desenharWizard('Editar produto');
}
function fotoNormalizada() {
  const a = fotosProntas().map(f => {
    if (f.startsWith('data:') || f.startsWith('http')) return f;
    return f.replace(/^\.\.\//, '');
  }).filter(Boolean);
  WIZ.fotos = a;
  WIZ.foto = a[0] || '';
  return WIZ.foto;
}
// reduz foto para caber no aparelho (evita estourar o armazenamento local)
function reduzFoto(dataUrl, maxDim, qual) {
  maxDim = maxDim || 1000; qual = qual || 0.72;
  return new Promise(res => {
    try {
      const img = new Image();
      img.onload = () => {
        try {
          const k = Math.min(1, maxDim / Math.max(img.width || 1, img.height || 1));
          if (k >= 1) { res(dataUrl); return; }
          const c = document.createElement('canvas');
          c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          res(c.toDataURL('image/jpeg', qual));
        } catch { res(dataUrl); }
      };
      img.onerror = () => res(dataUrl);
      img.src = dataUrl;
    } catch { res(dataUrl); }
  });
}
// Galeria do wizard: arrastar troca a capa (primeira), X remove
function renderFotosWizard() {
  const box = document.getElementById('wFotos');
  if (!box || !WIZ) return;
  const arr = fotosDoWiz();
  box.innerHTML = arr.map((f, i) => {
    if (!f || f.__loading) return `<div class="wfoto loading"><div class="spin"></div></div>`;
    return `<div class="wfoto${i === 0 ? ' capa' : ''}" draggable="true" data-i="${i}" title="Arraste para trocar a capa">`
    + `<img src="${f}" alt="">${i === 0 ? '<span class="tagc">Capa</span>' : ''}`
    + `<button class="xc" type="button" onclick="removerFotoIdx(${i})" aria-label="Remover">×</button></div>`;
  }).join('')
    || '<p class="chip-status" style="margin:0">Nenhuma foto ainda. Envie pelo botão acima.</p>';
  box.querySelectorAll('.wfoto[draggable="true"]').forEach(el => {
    el.addEventListener('dragstart', e => { e.dataTransfer.setData('text/plain', el.dataset.i); el.classList.add('arrast'); });
    el.addEventListener('dragend', () => el.classList.remove('arrast'));
    el.addEventListener('dragover', e => e.preventDefault());
    el.addEventListener('drop', e => {
      e.preventDefault();
      const de = +e.dataTransfer.getData('text/plain');
      const para = +el.dataset.i;
      if (isNaN(de) || de === para) return;
      const a = fotosDoWiz();
      const [mv] = a.splice(de, 1);
      a.splice(para, 0, mv);
      WIZ.fotos = a; WIZ.foto = a[0] || '';
      renderFotosWizard(); atualizaPrev();
    });
  });
}
function removerFotoIdx(i) {
  const a = fotosDoWiz();
  a.splice(i, 1);
  WIZ.fotos = a; WIZ.foto = a[0] || '';
  renderFotosWizard(); atualizaPrev();
}
function definirCapa(i) {
  const a = fotosDoWiz();
  if (!a[i]) return;
  const [mv] = a.splice(i, 1);
  a.unshift(mv);
  WIZ.fotos = a; WIZ.foto = a[0];
  renderFotosWizard(); atualizaPrev();
}
// Editor de produto em seções com prévia ao vivo
function escWiz(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/"/g, '').replace(/</g, '&lt;'); }
function sanitizarDescricao(html) {
  const box = document.createElement('div'); box.innerHTML = String(html || '');
  const permitidas = new Set(['B','STRONG','I','EM','U','BR','P','DIV','SPAN','FONT']);
  box.querySelectorAll('*').forEach(el => {
    if (!permitidas.has(el.tagName)) { el.replaceWith(document.createTextNode(el.textContent || '')); return; }
    [...el.attributes].forEach(a => {
      const aceitaFont = el.tagName === 'FONT' && (a.name === 'size' || (a.name === 'color' && /^#[0-9a-f]{3,8}$/i.test(a.value)));
      if (a.name !== 'style' && !aceitaFont) el.removeAttribute(a.name);
    });
    if (el.hasAttribute('style')) {
      const ok = String(el.getAttribute('style')).split(';').filter(part => /^(\s*)(color|font-size|font-weight|text-align)\s*:/i.test(part)).join(';');
      ok ? el.setAttribute('style', ok) : el.removeAttribute('style');
    }
  });
  return box.innerHTML;
}
function descricaoInicial(html) {
  const s = String(html || '');
  return s.includes('<') ? sanitizarDescricao(s) : escWiz(s).replace(/\n/g, '<br>');
}
function formatarDescricao(cmd, valor) {
  const ed = document.getElementById('wDesc'); if (!ed) return;
  ed.focus();
  if (cmd === 'formatBlock') document.execCommand(cmd, false, valor);
  else document.execCommand(cmd, false, null);
  lerPasso(); mostrarAvisoNaoSalvo();
}
function colorirDescricao(cor) { formatarDescricao('foreColor', cor); }
function tamanhoDescricao(tamanho) { formatarDescricao('fontSize', tamanho); }
function tamsAtuais() { try { return String(document.getElementById('wTams').value || WIZ.tamsTxt || '').split(',').map(s => s.trim()).filter(Boolean); } catch { return String(WIZ.tamsTxt || '').split(',').map(s => s.trim()).filter(Boolean); } }
function alternarTam(v) {
  const a = tamsAtuais();
  const i = a.findIndex(x => x.toLowerCase() === String(v).toLowerCase());
  if (i >= 0) a.splice(i, 1); else a.push(v);
  WIZ.tamsTxt = a.join(', ');
  const el = document.getElementById('wTams'); if (el) el.value = WIZ.tamsTxt;
  desenharChipsTam(); atualizaPrev();
}
function desenharChipsTam() {
  const box = document.getElementById('wTamsChips'); if (!box) return;
  const atual = tamsAtuais().map(x => x.toLowerCase());
   const opcoes = ['PP', 'P', 'M', 'G', 'GG', 'XG', '34', '36', '38', '40', '42', '44', '46', '48', 'Único'];
  box.innerHTML = opcoes.map(o => `<button type="button" class="chip-pick${atual.includes(o.toLowerCase()) ? ' on' : ''}" onclick="alternarTam('${o}')">${o}</button>`).join('');
}
function alternarCor(v) {

  const i = a.findIndex(x => x.toLowerCase() === String(v).toLowerCase());
  if (i >= 0) a.splice(i, 1); else a.push(v);
  WIZ.coresTxt = a.join(', ');
  const el = document.getElementById('wCores'); if (el) el.value = WIZ.coresTxt;
  desenharChipsCor(); atualizaPrev();
}
function desenharChipsCor() {
  const box = document.getElementById('wCoresChips'); if (!box) return;
  const atual = String((document.getElementById('wCores') || {}).value || WIZ.coresTxt || '').split(',').map(s => s.trim().toLowerCase()).filter(Boolean);

function mixCorAdmin(hex, alvo, peso) {
  const h = String(hex || '').replace('#', '');
  if (!/^[0-9a-f]{6}$/i.test(h)) return alvo;
  const a = parseInt(h.slice(0, 2), 16), b = parseInt(h.slice(2, 4), 16), c = parseInt(h.slice(4, 6), 16);
  const t = alvo.match(/[0-9a-f]{2}/gi).map(x => parseInt(x, 16));
  return '#' + [a, b, c].map((v, i) => Math.round(v * (1 - peso) + t[i] * peso).toString(16).padStart(2, '0')).join('');
}

async function bannerUpload(i, input) {

    let url = null;

    try { sess = (typeof SB !== 'undefined' && SB.ok() && await SB.session()) ? true : false; } catch { sess = false; }
    if (sess) {
      try { toast('Enviando banner…'); } catch {}
      url = await SB.foto(f, 'banner' + Date.now().toString(36));
    } else {

    toast('Banner atualizado! Não esqueça de Salvar tudo.');

  }

function cupVencido(c) {
  try {
    if (!c.validade) return false;
    const iso = /^\d{2}\/\d{2}\/\d{4}$/.test(c.validade) ? brParaISO(c.validade) : c.validade;
    return new Date(iso + 'T23:59:59') < new Date();
  } catch { return false; }
}
function tipoCupSel() { try { return document.getElementById('cupTipo').value; } catch { return 'porcento'; } }
function setTipoCup(t) { const el = document.getElementById('cupTipo'); if (el) el.value = t; desenharTipoCup(); atualizaPrevCup(); }
function desenharTipoCup() {
  const t = tipoCupSel();
  document.querySelectorAll('.tipo-seg button').forEach(b => b.classList.toggle('on', b.dataset.t === t));
  const lbl = document.getElementById('cupValLbl');
  if (lbl) lbl.textContent = t === 'reais' ? 'Quanto de desconto? (R$)' : 'Quanto de desconto? (%)';
}
function modeloCupom(tipo, valor) {
  const cod = document.getElementById('cupCod'); if (cod) cod.value = 'BEMVINDA10';
  setTipoCup(tipo);
  const v = document.getElementById('cupVal'); if (v) v.value = valor;

function fmtDataBR(v) {
  v = String(v || '').trim();
  if (/^\d{2}\/\d{2}\/\d{4}$/.test(v)) return v;
  if (/^\d{4}-\d{2}-\d{2}$/.test(v)) return v.split('-').reverse().join('/');
  return v;
}
function brParaISO(v) {
  v = String(v || '').trim();
  if (!v) return '';
  const m = v.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
  if (!m) return null;
  const dd = +m[1], mm = +m[2], aa = +m[3];
  if (mm < 1 || mm > 12 || dd < 1 || dd > 31 || aa < 2020 || aa > 2100) return null;
  const d = new Date(aa, mm - 1, dd);
  if (d.getFullYear() !== aa || d.getMonth() !== mm - 1 || d.getDate() !== dd) return null;
  return `${aa}-${String(mm).padStart(2, '0')}-${String(dd).padStart(2, '0')}`;
}
function mascaraDataBR(el) {
  const dig = String(el.value || '').replace(/\D/g, '').slice(0, 8);
  let out = dig;
  if (dig.length > 4) out = dig.slice(0, 2) + '/' + dig.slice(2, 4) + '/' + dig.slice(4);
  else if (dig.length > 2) out = dig.slice(0, 2) + '/' + dig.slice(2);
  el.value = out;
}
function criarCupom() {

  const erro = DB.saveCoupon({ codigo: $('#cupCod').value, tipo: $('#cupTipo').value, valor: $('#cupVal').value, validade: venISO || '', minimo: $('#cupMin').value });
  if (erro) { toast(erro); return; }
  ocultarAvisoNaoSalvo();
  toast('Cupom criado!');
  rPromocoes();
}

async function testarSupabase() {
  const box = $('#resSB');
  box.innerHTML = '';
  $('#btnSB').disabled = true;
  try {
    const temSB = (typeof SB !== 'undefined' && SB.ok());
    passoTeste(box, temSB, 'Programa de ligação carregado', temSB ? 'Biblioteca pronta.' : 'Sem biblioteca ou sem internet para o CDN.');
    if (!temSB) { passoTeste(box, false, 'Resultado', 'Conecte a internet e recarregue a página.'); return; }
    // tabelas
    let tabelasOk = true, faltando = [];
    for (const t of ['categorias', 'produtos', 'pedidos', 'cupons', 'configuracoes']) {
      try {
        const linhas = await comTempo(SB.ler(t), 12000, t);
        passoTeste(box, true, `Tabela "${t}" existe`, `${linhas.length} registro(s) lidos.`);
      } catch (e) {
        const msg = String((e && e.message) || e);
        tabelasOk = false;
        if (/fetch|network|failed|load/i.test(msg)) faltando.push(t + ' (internet?)');
        else faltando.push(t);
        passoTeste(box, false, `Tabela "${t}" com problema`, msg.slice(0, 140));
      }
    }
    if (!tabelasOk) {
      passoTeste(box, false, 'Falta rodar o SQL', 'Abra o arquivo supabase-schema.sql, cole no SQL Editor do Supabase e clique em RUN. Depois teste de novo.');
      return;
    }
    // login

      <div id="ikPrev" style="display:flex;gap:10px;margin-top:10px;flex-wrap:wrap"></div></div>`);

      prev.innerHTML = `<div><div class="chip-status">Original</div><img id="ikA" style="max-width:220px;border-radius:8px;border:1px solid #E6DCCF"></div>

      a.onerror = () => passoTeste(box, false, 'Foto original abriu', 'Não achei esse arquivo na conta. Confira o nome.');
      b.onload = () => passoTeste(box, true, 'Miniatura automática', 'O redimensionamento funciona.');
      b.onerror = () => passoTeste(box, false, 'Miniatura automática', 'Não gerou a miniatura.');
